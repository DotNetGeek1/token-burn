<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="160" viewBox="0 0 1920 160">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#555048"/><stop offset=".5" stop-color="#201f1d"/><stop offset="1" stop-color="#0d0e0e"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ef4b3f"/><stop offset=".35" stop-color="#b52b24"/><stop offset="1" stop-color="#5b1512"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#282826"/><stop offset="1" stop-color="#090a0a"/></linearGradient>
    <pattern id="stripe" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="18" fill="#d6a64a" opacity=".65"/><rect x="9" width="9" height="18" fill="#1a1713"/></pattern>
  </defs>
  <!-- each state is 480x160; dynamic text belongs in code -->
  <g id="idle">
    <rect x="10" y="13" width="460" height="134" rx="18" fill="url(#metal)" stroke="#655f56" stroke-width="6"/>
    <rect x="36" y="37" width="408" height="86" rx="12" fill="url(#dark)" stroke="#34322f" stroke-width="5"/>
    <path d="M48 53h384M48 70h384M48 87h384M48 104h384" stroke="#050606" stroke-width="8" opacity=".8"/>
  </g>
  <g id="armed" transform="translate(480)">
    <rect x="10" y="13" width="460" height="134" rx="18" fill="url(#metal)" stroke="#766d60" stroke-width="6"/>
    <rect x="36" y="37" width="408" height="86" rx="12" fill="url(#red)" stroke="#ff7a68" stroke-width="5"/>
    <rect x="48" y="48" width="384" height="11" rx="5" fill="#ffb0a3" opacity=".38"/>
  </g>
  <g id="danger" transform="translate(960)">
    <rect x="10" y="13" width="460" height="134" rx="18" fill="url(#metal)" stroke="#f2c263" stroke-width="6"/>
    <rect x="24" y="25" width="432" height="110" rx="13" fill="url(#stripe)" opacity=".7"/>
    <rect x="43" y="42" width="394" height="76" rx="10" fill="url(#red)" stroke="#f04b3e" stroke-width="5"/>
  </g>
  <g id="busy" transform="translate(1440)">
    <rect x="10" y="13" width="460" height="134" rx="18" fill="url(#metal)" stroke="#403d38" stroke-width="6"/>
    <rect x="36" y="37" width="408" height="86" rx="12" fill="#171817" stroke="#34322f" stroke-width="5"/>
    <path d="M62 80h356" stroke="#d6a64a" stroke-width="9" stroke-dasharray="20 14" opacity=".55"/>
    <path d="M213 28v104M267 28v104" stroke="#777066" stroke-width="7" opacity=".8"/>
  </g>
</svg>


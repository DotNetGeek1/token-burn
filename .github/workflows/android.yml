name: Android AAB

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "core/**"
      - "ui/**"
      - "systems/**"
      - "definitions/**"
      - "content/**"
      - "presentation/**"
      - "config/**"
      - "export/**"
      - "project.godot"
      - "tools/export_android.*"
      - "tools/inspect_aab.py"
      - "tools/merge_android_preset.py"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - "ui/**"
      - "systems/**"
      - "definitions/**"
      - "content/**"
      - "presentation/**"
      - "config/**"
      - "export/**"
      - "project.godot"
      - "tools/export_android.*"
      - "tools/inspect_aab.py"
      - "tools/merge_android_preset.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1
  BUNDLETOOL_VERSION: 1.18.1

jobs:
  aab-debug:
    name: Debug AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Godot Android editor settings
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$SDK"
          EOF

      - name: Import project
        run: godot --headless --import --quit-after 8

      - name: Debug keystore
        run: |
          keytool -genkeypair -keystore "$HOME/android-debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Download bundletool
        run: |
          mkdir -p build
          curl -sL -o build/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

      - name: Export debug AAB
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/android-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          BUNDLETOOL_JAR: ${{ github.workspace }}/build/bundletool.jar
        run: bash tools/export_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: token_burn-debug.aab
          path: build/android/token_burn.aab
          if-no-files-found: error

  aab-release:
    name: Signed release AAB
    # `secrets` cannot be read in a job-level `if`; the first step decides
    # whether the signing material exists and later steps gate on it.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEY_ALIAS" && -n "$KEYSTORE_PASSWORD" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEYSTORE_PASSWORD not set; skipping signed release."
          fi

      - uses: actions/checkout@v4
        if: steps.signing.outputs.present == 'true'

      - uses: actions/setup-java@v4
        if: steps.signing.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.present == 'true'
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: chickensoft-games/setup-godot@v2
        if: steps.signing.outputs.present == 'true'
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Godot Android editor settings
        if: steps.signing.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$SDK"
          EOF

      - name: Import project
        if: steps.signing.outputs.present == 'true'
        run: godot --headless --import --quit-after 8

      - name: Decode release keystore
        if: steps.signing.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/token-burn-release.keystore"
          test -s "$HOME/token-burn-release.keystore"

      - name: Download bundletool
        if: steps.signing.outputs.present == 'true'
        run: |
          mkdir -p build
          curl -sL -o build/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

      - name: Export release AAB
        if: steps.signing.outputs.present == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/token-burn-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUNDLETOOL_JAR: ${{ github.workspace }}/build/bundletool.jar
        run: bash tools/export_android.sh

      - uses: softprops/action-gh-release@v2
        if: steps.signing.outputs.present == 'true'
        with:
          files: build/android/token_burn.aab
          fail_on_unmatched_files: true

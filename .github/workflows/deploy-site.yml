name: Deploy promo site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "export/**"
      - "tools/export_web.ps1"
      - "project.godot"
      - "content/**"
      - "core/**"
      - "systems/**"
      - "ui/**"
      - "presentation/**"
      - "definitions/**"
      - "config/**"
      - ".github/workflows/deploy-site.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "site/**"
      - "export/**"
      - "tools/export_web.ps1"
      - "project.godot"
      - "content/**"
      - "core/**"
      - "systems/**"
      - "ui/**"
      - "presentation/**"
      - "definitions/**"
      - "config/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: Export Godot web build
        run: |
          cp export/web_export_presets.cfg export_presets.cfg
          mkdir -p site/public/game
          godot --headless --export-release Web site/public/game/index.html
          test -f site/public/game/index.html
          test -f site/public/game/index.wasm
          test -f site/public/game/index.pck

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build static export
        working-directory: site
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site/out
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - name: Close staging site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
